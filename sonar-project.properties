# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_nrf-impact-assessor
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/nrf-impact-assessor
sonar.links.ci=https://github.com/DEFRA/nrf-impact-assessor/actions
sonar.links.scm=https://github.com/DEFRA/nrf-impact-assessor
sonar.links.issue=https://github.com/DEFRA/nrf-impact-assessor/issues

sonar.sources=app/
sonar.exclusions=app/**/test_*.py
sonar.tests=tests/
sonar.test.inclusions=app/**/test_*.py

# Written by pytest-cov via the --cov-report=xml addopts in pytest.ini. Without
# this Sonar ingests no coverage at all and reports 0% on new code, which is why
# the quality gate passed on untested changes. Note the report reflects whatever
# pytest ran: pytest.ini deselects integration and regression by default, so a
# bare `uv run pytest` yields unit coverage only.
sonar.python.coverage.reportPaths=coverage.xml

sonar.python.version=3.14
