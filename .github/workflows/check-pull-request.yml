name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Alembic / Liquibase migration parity
        run: python scripts/check_migration_parity.py

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      # Self-heal a stale lockfile (e.g. a Dependabot bump that did not fully
      # update uv.lock) so the checks below pass on the first run.
      - name: Regenerate lockfile
        run: uv lock

      - name: Test code and Create Test Coverage Reports
        run: |
          uv sync --frozen
          uv run ruff check
          uv run pytest

      - name: Set git hash
        run: echo "${{ github.sha }}" > .git-hash

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag nrf-impact-assessor .
          exit $?

      - name: Verify git hash in Docker image
        run: docker run --rm --entrypoint cat nrf-impact-assessor .git-hash

  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
      OS_API_KEY: ${{ secrets.OS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t defradigital/nrf-impact-assessor:${{ github.sha }} .
      - uses: DEFRA/nrf-journey-tests/run-journey-tests@main
        with:
          nrf-impact-assessor: ${{ github.sha }}
